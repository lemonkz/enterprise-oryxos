<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" font-family="-apple-system,'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="entryGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="960" height="800" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="480" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">OryxOS 核心架构</text>
  <text x="480" y="78" text-anchor="middle" font-size="13" fill="#64748b">三个触发源汇入统一入口，核心引擎不感知消息来源</text>

  <!-- ===== 触发层 ===== -->
  <text x="60" y="136" font-size="12" fill="#94a3b8">触发层</text>

  <g>
    <rect x="80" y="152" width="240" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="200" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">CLI Channel</text>
    <text x="200" y="203" text-anchor="middle" font-size="12" fill="#64748b">命令行交互</text>
    <rect x="178" y="142" width="44" height="20" rx="10" fill="#6366f1"/>
    <text x="200" y="156" text-anchor="middle" font-size="11" fill="#ffffff">人推</text>
  </g>
  <g>
    <rect x="360" y="152" width="240" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="480" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">Web Service</text>
    <text x="480" y="203" text-anchor="middle" font-size="12" fill="#64748b">REST API</text>
    <rect x="458" y="142" width="44" height="20" rx="10" fill="#6366f1"/>
    <text x="480" y="156" text-anchor="middle" font-size="11" fill="#ffffff">人推</text>
  </g>
  <g>
    <rect x="640" y="152" width="240" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="760" y="181" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">AgentScheduler</text>
    <text x="760" y="203" text-anchor="middle" font-size="12" fill="#64748b">cron 定时任务</text>
    <rect x="738" y="142" width="44" height="20" rx="10" fill="#a855f7"/>
    <text x="760" y="156" text-anchor="middle" font-size="11" fill="#ffffff">钟推</text>
  </g>

  <line x1="200" y1="212" x2="200" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="212" x2="480" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="212" x2="760" y2="256" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== 统一入口 ===== -->
  <rect x="180" y="262" width="600" height="40" rx="20" fill="url(#entryGrad)"/>
  <text x="480" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">AgentService.process() · 统一入口</text>

  <line x1="480" y1="302" x2="480" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== 引擎层 ===== -->
  <text x="60" y="338" font-size="12" fill="#94a3b8">引擎层</text>

  <rect x="120" y="346" width="720" height="140" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="480" y="374" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">运行时引擎（自实现 ReAct）</text>

  <g>
    <rect x="160" y="394" width="180" height="60" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="250" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">ReActLoop</text>
    <text x="250" y="440" text-anchor="middle" font-size="11" fill="#64748b">思考 → 行动 → 观察</text>
  </g>
  <line x1="346" y1="424" x2="384" y2="424" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g>
    <rect x="390" y="394" width="180" height="60" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="480" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">PromptBuilder</text>
    <text x="480" y="440" text-anchor="middle" font-size="11" fill="#64748b">四段式上下文</text>
  </g>
  <line x1="576" y1="424" x2="614" y2="424" stroke="#64748b" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <g>
    <rect x="620" y="394" width="180" height="60" rx="10" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="710" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">ToolExecutor</text>
    <text x="710" y="440" text-anchor="middle" font-size="11" fill="#64748b">工具调度 + 沙箱</text>
  </g>

  <line x1="200" y1="486" x2="200" y2="524" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="486" x2="480" y2="524" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="486" x2="760" y2="524" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== 能力层 ===== -->
  <text x="60" y="514" font-size="12" fill="#94a3b8">能力层</text>

  <g>
    <rect x="80" y="530" width="240" height="100" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="200" y="560" text-anchor="middle" font-size="15" font-weight="700" fill="#065f46">Provider 能力一</text>
    <text x="200" y="585" text-anchor="middle" font-size="12" fill="#4b5563">LLM 统一接入</text>
    <text x="200" y="608" text-anchor="middle" font-size="12" fill="#4b5563">name → ChatModel 显式映射</text>
  </g>
  <g>
    <rect x="360" y="530" width="240" height="100" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="480" y="560" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Memory 能力三</text>
    <text x="480" y="585" text-anchor="middle" font-size="12" fill="#4b5563">会话 + MEMORY.md 长期记忆</text>
    <text x="480" y="608" text-anchor="middle" font-size="12" fill="#4b5563">后端可插拔 md / sqlite / mem0</text>
  </g>
  <g>
    <rect x="640" y="530" width="240" height="100" rx="12" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="760" y="560" text-anchor="middle" font-size="15" font-weight="700" fill="#075985">Tool 能力四</text>
    <text x="760" y="585" text-anchor="middle" font-size="12" fill="#4b5563">内置 9 工具 + MCP 扩展</text>
    <text x="760" y="608" text-anchor="middle" font-size="12" fill="#4b5563">Plugin Tool 三档接入</text>
  </g>

  <!-- ===== 外部依赖 ===== -->
  <text x="60" y="660" font-size="12" fill="#94a3b8">外部依赖</text>

  <line x1="200" y1="630" x2="173" y2="672" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="630" x2="383" y2="672" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="630" x2="593" y2="672" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="630" x2="803" y2="672" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="80" y="678" width="186" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="173" y="703" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">各家 LLM API</text>
    <text x="173" y="724" text-anchor="middle" font-size="11" fill="#6b7280">OpenAI 兼容 · 主流模型</text>
  </g>
  <g>
    <rect x="290" y="678" width="186" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="383" y="703" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">SQLite + 文件</text>
    <text x="383" y="724" text-anchor="middle" font-size="11" fill="#6b7280">会话 · 审计 · MEMORY.md</text>
  </g>
  <g>
    <rect x="500" y="678" width="186" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="593" y="703" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">MCP Server</text>
    <text x="593" y="724" text-anchor="middle" font-size="11" fill="#6b7280">stdio 优先</text>
  </g>
  <g>
    <rect x="710" y="678" width="186" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="803" y="703" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">企业用户系统</text>
    <text x="803" y="724" text-anchor="middle" font-size="11" fill="#6b7280">飞书 · 企微 · 钉钉 · Webhook</text>
  </g>

  <text x="480" y="778" text-anchor="middle" font-size="11" fill="#94a3b8">OryxOS · 一个目录 = 一个 Agent · 私有部署 · 可审计</text>
</svg>
